<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Ecosystem App Shell</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .phone-container {
            width: 360px;
            height: 740px;
            background-color: #1e293b;
            border: 12px solid #334155;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .phone-header {
            background-color: #0f172a;
            padding: 20px 20px 15px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .phone-header h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .phone-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .card {
            background-color: #0f172a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status-badge {
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            display: inline-block;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="phone-header">
            <h1>Students-Ecosystem</h1>
        </div>
        
        <div class="phone-body">
            <div class="card">
                <div class="card-title">Active Track</div>
                <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 6px;">M.Sc. Computer Science</div>
                <div style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px;">LMU Munich · Germany</div>
                <div class="status-badge">🔄 Document Verification In-Progress</div>
            </div>

            <div class="card">
                <div class="card-title">Recommendation request</div>
                <div class="input-group">
                    <label>Professor Name</label>
                    <input id="professor-name" type="text" placeholder="Professor name">
                </div>
                <div class="input-group">
                    <label>Institutional Email</label>
                    <input id="professor-email" type="email" placeholder="name@university.edu">
                </div>
                <p style="font-size:.8rem;color:#cbd5e1;line-height:1.4">Email sending is disabled until a verified institution and email provider are configured.</p>
                <button class="btn" type="button" onclick="showLORNotice()">Prepare request</button>
            </div>

            <div class="card">
                <div class="card-title">Statement readiness check</div>
                <div class="input-group">
                    <label>SOP Draft Excerpt</label>
                    <textarea id="statement" rows="4" style="resize:none" placeholder="Paste a short statement draft. The tool only highlights wording to review; it does not rewrite facts or predict outcomes."></textarea>
                </div>
                <button class="btn" type="button" onclick="reviewStatement()">Review statement</button>
                <div id="review-result" role="status" style="font-size:.8rem;color:#cbd5e1;line-height:1.5;margin-top:12px"></div>
            </div>
        </div>
    </div>

    <script>
      function showLORNotice() {
        alert('The request workflow is intentionally disabled until the email service and secure upload portal are configured. No message has been sent.');
      }

      async function reviewStatement() {
        const statement = document.getElementById('statement').value;
        const result = document.getElementById('review-result');
        result.textContent = 'Reviewing…';
        try {
          const response = await fetch('/api/v1/readiness/statement', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({statement})
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'The review could not be completed.');
          const findings = data.findings.length ? `Items to review: ${data.findings.join(', ')}.` : 'No configured keywords found.';
          result.textContent = `${findings} ${data.guidance.join(' ')}`;
        } catch (error) {
          result.textContent = error.message;
        }
      }
    </script>
</body>
</html>
