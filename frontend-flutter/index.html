<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Ecosystem App Shell</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .phone-container {
            width: 360px;
            height: 740px;
            background-color: #1e293b;
            border: 12px solid #334155;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .phone-header {
            background-color: #0f172a;
            padding: 20px 20px 15px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .phone-header h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .phone-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .card {
            background-color: #0f172a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status-badge {
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            display: inline-block;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="phone-header">
            <h1>🛡️ Students-Ecosystem</h1>
        </div>
        
        <div class="phone-body">
            <div class="card">
                <div class="card-title">Active Track</div>
                <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 6px;">M.Sc. Computer Science</div>
                <div style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px;">LMU Munich · Germany</div>
                <div class="status-badge">🔄 Document Verification In-Progress</div>
            </div>

            <div class="card">
                <div class="card-title">Cryptographic LOR Portal</div>
                <div class="input-group">
                    <label>Professor Name</label>
                    <input type="text" value="Dr. Jan Svensson" readonly>
                </div>
                <div class="input-group">
                    <label>Institutional Email</label>
                    <input type="text" value="j.svensson@university.edu" readonly>
                </div>
                <button class="btn" onclick="alert('Secure token tracking webhook dispatched to server!')">Generate Sealed Token</button>
            </div>

            <div class="card">
                <div class="card-title">AI Statement of Purpose Shield</div>
                <div class="input-group">
                    <label>SOP Draft Excerpt</label>
                    <textarea rows="3" style="resize:none; background-color:#1e293b; color:#94a3b8;" readonly>...My main goal is to migrate permanently and find full-time asylum options immediately after my entry visa is active...</textarea>
                </div>
                <button class="btn" style="background-color: #b91c1c;" onclick="alert('Scanning script executed: Flagged critical immigration risk triggers.')">Analyze Visa Risks</button>
            </div>
        </div>
    </div>

</body>
</html>
